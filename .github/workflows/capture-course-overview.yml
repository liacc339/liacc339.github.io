name: Capture Course Operations Screenshot
on:
  push:
    paths:
      - ".github/workflows/capture-course-overview.yml"
permissions:
  contents: write
jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install screenshot dependencies
        run: |
          python -m pip install --quiet playwright pillow
          python -m playwright install chromium
      - name: Capture POC overview in full resolution
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from PIL import Image
          import os
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True, args=["--no-sandbox"])
              page = browser.new_page(viewport={"width":1912,"height":940}, device_scale_factor=1)
              page.goto("https://course-operations-ai-assistant-1.onrender.com/#overview", wait_until="domcontentloaded", timeout=120000)
              page.get_by_text("本期运营情况", exact=False).first.wait_for(timeout=90000)
              page.wait_for_timeout(4000)
              page.screenshot(path="/tmp/course-overview.png", full_page=False, animations="disabled")
              browser.close()
          im=Image.open("/tmp/course-overview.png").convert("RGB")
          assert im.size==(1912,940), im.size
          os.makedirs("assets",exist_ok=True)
          im.save("assets/course-operations-overview-hd.webp","WEBP",quality=92,method=6)
          print("Created 1912x940 screenshot:",os.path.getsize("assets/course-operations-overview-hd.webp"),"bytes")
          PY
      - name: Commit screenshot to the website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/course-operations-overview-hd.webp
          if ! git diff --cached --quiet; then
            git commit -m "Replace blurry course preview with full-resolution screenshot"
            git push
          fi
