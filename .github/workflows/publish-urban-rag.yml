name: Publish urban RAG screenshot
on:
  push:
    paths:
      - ".github/workflows/publish-urban-rag.yml"
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download uploaded screenshot in original dimensions
        env:
          CANVA_PREVIEW_URL: 'https://media.canva.com/v2/image-resize/format:PNG/height:98/quality:100/uri:ifs%3A%2F%2FM%2F7a37fe24-523d-41a3-b3ce-676fba12accc/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAN4gGWqHrax97Z6_rW_huKdJSTcMtJ2YDKqvVpWhWwXX&exp=1792506221&osig=AAAAAAAAAAAAAAAAAAAAAL34DhQpdf_Pu8fKkFced8kbXGrukLUMffP4ztAbm0iZ&signer=media-rpc&token=AAIAAU0AJDdhMzdmZTI0LTUyM2QtNDFhMy1iM2NlLTY3NmZiYTEyYWNjYwAAAAABoVmyUcgFzgDXqY54fT6wpdy1NHQh0k7zPvW3rajlj1FDXcSJ_w&x-canva-quality=thumbnail'
          CANVA_FULL_URL: 'https://media.canva.com/v2/image-resize/format:PNG/height:877/quality:100/uri:ifs%3A%2F%2FM%2F7a37fe24-523d-41a3-b3ce-676fba12accc/watermark:F/width:1782?csig=AAAAAAAAAAAAAAAAAAAAAN4gGWqHrax97Z6_rW_huKdJSTcMtJ2YDKqvVpWhWwXX&exp=1792506221&osig=AAAAAAAAAAAAAAAAAAAAAL34DhQpdf_Pu8fKkFced8kbXGrukLUMffP4ztAbm0iZ&signer=media-rpc&token=AAIAAU0AJDdhMzdmZTI0LTUyM2QtNDFhMy1iM2NlLTY3NmZiYTEyYWNjYwAAAAABoVmyUcgFzgDXqY54fT6wpdy1NHQh0k7zPvW3rajlj1FDXcSJ_w&x-canva-quality=thumbnail'
        run: |
          python -m pip -q install requests pillow
          python - <<'PY'
          import requests, os, io
          from PIL import Image
          for key in ['CANVA_FULL_URL','CANVA_PREVIEW_URL']:
              response=requests.get(os.environ[key],timeout=30)
              print(key, 'status=',response.status_code, 'bytes=',len(response.content),'type=',response.headers.get('Content-Type'))
              if response.status_code!=200:
                  print(response.text[:240])
                  continue
              try:
                  image=Image.open(io.BytesIO(response.content))
              except Exception as ex:
                  print('image invalid:', str(ex)[:100])
                  continue
              print('image dims',image.size)
              if image.width >= 1500 and image.height >= 700:
                  os.makedirs('assets',exist_ok=True)
                  image.convert('RGB').save('assets/city-vitality-overview-hd.webp','WEBP',quality=90,method=6)
                  print('Saved high-res city screenshot!')
                  break
          else:
              print('High-res Canva media unavailable; stopping rather than publishing blurry image.')
              raise SystemExit(3)
          PY
      - name: Publish screenshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/city-vitality-overview-hd.webp
          git diff --cached --quiet || (git commit -m "Add high-resolution city RAG screenshot" && git push)
