<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>AI业务解决方案知识库｜企业通用与垂直行业</title>
  <style>
    :root { --nav:#142b49; --nav-soft:#213b5c; --ink:#18283b; --muted:#65758a; --line:#dde5ec; --surface:#fff; --bg:#f4f6f8; --accent:#24609c; --accent-pale:#eaf2fa; --focus:#1f69a9; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; color:var(--ink); background:var(--bg); font:15px/1.6 "Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif; }
    button, input { font:inherit; }
    button { cursor:pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline:3px solid #8ab8e7; outline-offset:2px; }
    .app { min-height:100vh; display:grid; grid-template-columns:270px minmax(0,1fr); }
    .sidebar { background:var(--nav); color:#eaf0f7; padding:24px 15px 28px; position:sticky; top:0; align-self:start; height:100vh; overflow-y:auto; }
    .brand { padding:0 12px 20px; border-bottom:1px solid #36506e; }
    .brand-kicker { color:#a8c3df; font-size:11px; font-weight:700; letter-spacing:.14em; }
    .brand-title { margin:8px 0 4px; color:#fff; font-size:18px; line-height:1.4; font-weight:700; }
    .brand-subtitle { margin:0; color:#b8c8d9; font-size:12px; }
    .nav-home { width:100%; margin:18px 0 11px; padding:10px 13px; background:transparent; color:#eaf0f7; border:1px solid #4b6380; border-radius:8px; text-align:left; font-weight:600; }
    .nav-home:hover, .nav-home.active { background:#2b4e75; border-color:#6e95bf; }
    .nav-tech { margin:0 0 11px; }
    .nav-group { margin:17px 0 5px; padding:0 12px; color:#9fb8d2; font-size:11px; font-weight:700; letter-spacing:.04em; }
    .nav-system { display:flex; align-items:center; justify-content:space-between; width:100%; margin:12px 0 5px; padding:10px 11px; border:1px solid #425f7c; border-radius:7px; background:#1b3655; color:#fff; text-align:left; font-size:13px; font-weight:700; }
    .nav-system:hover { background:#294769; }
    .nav-system[aria-expanded="true"] { border-color:#779ec2; }
    .nav-system-panel[hidden] { display:none; }
    .nav-system-panel .nav-item { padding-left:13px; }
    .nav-item { display:flex; align-items:center; gap:8px; width:100%; margin:3px 0; padding:9px 11px; color:#dbe7f2; background:transparent; border:0; border-radius:8px; text-align:left; font-size:13px; }
    .nav-item:hover, .nav-item.active { background:var(--nav-soft); color:#fff; }
    .nav-item.active { box-shadow:inset 3px 0 0 #83b8e6; }
    .nav-code { flex:none; min-width:47px; color:#a8c7e6; font-size:11px; font-weight:700; }
    .nav-name { min-width:0; flex:1; }
    .main { min-width:0; }
    .topbar { position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:18px; min-height:76px; padding:15px 41px; background:rgba(255,255,255,.97); border-bottom:1px solid var(--line); }
    .topbar-title { margin:0; flex:1; font-size:15px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .search-wrap { position:relative; flex:0 1 390px; }
    .search-wrap input { width:100%; height:42px; padding:0 39px 0 15px; border:1px solid #c7d3df; border-radius:8px; background:#f9fbfd; color:var(--ink); font-size:13px; }
    .search-wrap input::placeholder { color:#78889a; }
    .clear-search { position:absolute; right:8px; top:7px; width:28px; height:28px; border:0; border-radius:5px; background:transparent; color:var(--muted); font-size:20px; line-height:1; }
    .clear-search:hover { background:#e7eef5; }
    .content { max-width:1350px; margin:0 auto; padding:36px 41px 72px; }
    .eyebrow { margin:0 0 8px; color:var(--accent); font-size:12px; font-weight:700; letter-spacing:.1em; }
    h1 { margin:0; font-size:30px; line-height:1.3; letter-spacing:-.025em; }
    .intro { max-width:850px; margin:13px 0 0; color:var(--muted); font-size:14px; }
    .stats { display:flex; flex-wrap:wrap; gap:10px; margin:24px 0 30px; }
    .stat { display:flex; align-items:baseline; gap:6px; padding:9px 13px; background:#fff; border:1px solid var(--line); border-radius:7px; color:var(--muted); font-size:12px; }
    .stat strong { color:var(--ink); font-size:17px; }
    .section-title { display:flex; align-items:baseline; gap:10px; margin:32px 0 14px; border-bottom:1px solid var(--line); padding-bottom:10px; }
    .section-title h2 { margin:0; font-size:18px; }
    .section-title span { color:var(--muted); font-size:12px; }
    .overview-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:12px; }
    .domain-card { display:flex; flex-direction:column; width:100%; min-height:128px; padding:14px 17px; background:var(--surface); border:1px solid var(--line); border-radius:10px; text-align:left; box-shadow:0 1px 2px rgba(20,43,73,.025); transition:border-color .15s,transform .15s; }
    .domain-card:hover { border-color:#9ebbd7; transform:translateY(-2px); }
    .card-heading { display:flex; align-items:baseline; flex-wrap:wrap; column-gap:6px; line-height:1.35; }
    .card-code { flex:none; color:var(--accent); font-size:19px; font-weight:700; }
    .card-separator { color:#8ba0b4; font-size:14px; }
    .card-title { color:var(--ink); font-size:15px; font-weight:700; }
    .card-summary { flex:1; margin-top:7px; color:var(--muted); font-size:12px; line-height:1.5; }
    .card-foot { margin-top:9px; color:var(--accent); font-size:12px; font-weight:600; }
    .context-note { margin-top:30px; padding:16px 19px; background:#edf3f8; border-left:3px solid #6c95bb; border-radius:0 7px 7px 0; color:#405a73; font-size:13px; }
    .pending-list { margin-top:16px; padding:14px 18px; background:#fff; border:1px solid var(--line); border-radius:8px; }
    .pending-list summary { cursor:pointer; color:#335979; font-size:13px; font-weight:700; }
    .pending-group { padding:12px 0 4px; border-top:1px solid #e9eef3; }
    .pending-group:first-of-type { margin-top:13px; }
    .pending-group h3 { margin:0 0 5px; font-size:13px; }
    .pending-group p { margin:4px 0; color:var(--muted); font-size:12px; line-height:1.7; }
    .back-link { display:inline-flex; align-items:center; gap:5px; margin:0 0 23px; padding:0; background:transparent; border:0; color:var(--accent); font-size:13px; font-weight:600; }
    .back-link:hover { text-decoration:underline; }
    .detail-header { display:flex; justify-content:space-between; gap:20px; align-items:flex-start; }
    .detail-code { display:inline-block; margin:0 0 7px; padding:3px 8px; background:var(--accent-pale); color:var(--accent); border-radius:4px; font-size:12px; font-weight:700; }
    .detail-desc { max-width:860px; margin:10px 0 0; color:var(--muted); font-size:14px; }
    .detail-count { flex:none; margin-top:8px; color:var(--muted); font-size:12px; }
    .relation-note { margin:22px 0 3px; padding:12px 15px; background:#edf3f8; border-left:3px solid #7ca5c6; border-radius:0 6px 6px 0; color:#425d78; font-size:13px; }
    .column-headings { display:grid; grid-template-columns:minmax(170px,26%) minmax(0,1fr); margin:34px 0 14px; padding-bottom:10px; border-bottom:1px solid var(--line); }
    .column-headings h2 { margin:0; font-size:18px; }
    .column-headings h2:first-child { padding-left:46px; }
    .column-headings h2:last-child { padding-left:20px; }
    .line-list { display:grid; gap:12px; }
    .line-card { display:grid; grid-template-columns:minmax(170px,26%) minmax(0,1fr); background:var(--surface); border:1px solid var(--line); border-radius:9px; overflow:hidden; }
    .line-side { display:flex; align-items:flex-start; gap:10px; padding:19px 16px 18px 19px; background:#f9fbfd; border-right:1px solid var(--line); }
    .line-index { flex:none; margin-top:2px; color:#7993aa; font-size:11px; font-weight:700; }
    .line-toggle { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; width:100%; padding:0; border:0; background:transparent; text-align:left; color:var(--ink); font-size:15px; font-weight:700; line-height:1.5; }
    .line-toggle:hover { color:var(--accent); }
    .chevron { color:#7891aa; font-size:13px; transform:rotate(0deg); transition:transform .15s; }
    .line-card.collapsed .chevron { transform:rotate(-90deg); }
    .line-content { padding:17px 20px 18px; min-width:0; }
    .ai-list { display:flex; flex-wrap:wrap; gap:8px; margin:0; padding:0; list-style:none; }
    .ai-list li { padding:6px 10px; background:#f0f5fa; border:1px solid #dce8f2; border-radius:5px; color:#264763; font-size:13px; }
    .line-card.collapsed .line-content { display:none; }
    .learning-layout { display:grid; grid-template-columns:minmax(410px,45%) minmax(0,1fr); gap:18px; align-items:start; margin-top:30px; }
    .business-pane { min-width:0; }
    .business-pane .column-headings { grid-template-columns:minmax(130px,38%) minmax(0,1fr); margin:0 0 11px; }
    .business-pane .column-headings h2 { font-size:15px; }
    .business-pane .column-headings h2:first-child { padding-left:31px; }
    .business-pane .column-headings h2:last-child { padding-left:13px; }
    .business-pane .line-list { gap:8px; }
    .business-pane .line-card { grid-template-columns:minmax(130px,38%) minmax(0,1fr); }
    .business-pane .line-side { gap:7px; padding:13px 10px 12px 12px; }
    .business-pane .line-toggle { font-size:13px; }
    .business-pane .line-content { padding:10px 11px; }
    .business-pane .ai-list { gap:5px; }
    .business-pane .ai-list li { padding:0; border:0; background:transparent; }
    .scene-button { width:100%; padding:5px 7px; border:1px solid #d6e3ef; border-radius:5px; background:#f1f6fa; color:#254963; text-align:left; font-size:12px; line-height:1.4; }
    .scene-button:hover, .scene-button.active { border-color:#80aacd; background:#e5f0f9; }
    .scene-button.active { box-shadow:inset 2px 0 0 var(--accent); }
    .scene-button.pending { background:#f8f9fb; border-color:#e3e7eb; color:#566777; }
    .scene-status { margin-left:5px; color:#82909c; font-size:10px; white-space:nowrap; }
    .pane-summary { margin:0 0 12px; color:var(--muted); font-size:12px; }
    .solution-pane { position:sticky; top:94px; max-height:calc(100vh - 110px); overflow:auto; min-width:0; background:#fff; border:1px solid var(--line); border-radius:10px; }
    .solution-inner { padding:22px 25px 28px; }
    .solution-kicker { color:var(--accent); font-size:11px; font-weight:700; letter-spacing:.06em; }
    .solution-title { margin:6px 0 5px; font-size:21px; line-height:1.35; }
    .solution-path { margin:0 0 15px; color:var(--muted); font-size:12px; }
    .solution-status { display:inline-block; margin:7px 0 0; padding:3px 7px; border-radius:4px; background:#edf5ed; color:#3b6941; font-size:11px; font-weight:700; }
    .solution-status.pending { background:#f3f5f7; color:#66798b; }
    .solution-empty { padding:50px 28px; color:var(--muted); text-align:center; }
    .solution-empty h2 { margin:0 0 7px; color:var(--ink); font-size:19px; }
    .solution-empty p { margin:0; font-size:13px; }
    .module { padding:17px 0; border-bottom:1px solid #e6edf3; }
    .module:last-child { border-bottom:0; }
    .module h3 { margin:0 0 8px; font-size:15px; }
    .module p { margin:6px 0; color:#40536a; font-size:13px; line-height:1.8; }
    .module p strong { color:var(--ink); }
    .module ul, .module ol { margin:7px 0 0; padding-left:21px; color:#40536a; font-size:13px; line-height:1.75; }
    .module li + li { margin-top:7px; }
    .path-step { display:flex; flex-wrap:wrap; gap:5px 9px; align-items:baseline; }
    .task-flow { display:grid; gap:7px; margin-top:10px; }
    .task-node { position:relative; padding:10px 12px 10px 15px; border:1px solid var(--line); border-left:3px solid #95adc1; border-radius:6px; background:#fafcfe; }
    .task-node + .task-node:before { content:"↓"; position:absolute; top:-18px; left:13px; color:#8ba3b8; font-weight:700; }
    .task-node[data-owner="AI"] { border-left-color:#517aaf; }
    .task-node[data-owner="人工"] { border-left-color:#7d8c9b; }
    .task-top { display:flex; align-items:baseline; gap:8px; }
    .task-number { color:#718aa1; font-size:11px; font-weight:700; }
    .task-owner { margin-left:auto; color:#586d7e; font-size:11px; white-space:nowrap; }
    .task-node p { margin:4px 0 0; font-size:12px; }
    .decision-details { margin-top:9px; border-top:1px solid var(--line); padding-top:7px; }
    .decision-details summary { width:max-content; color:#13527c; font-size:12px; font-weight:700; cursor:pointer; }
    .decision-details summary:hover { text-decoration:underline; }
    .decision-details summary:focus-visible { outline:2px solid #397ba9; outline-offset:3px; }
    .decision-list { display:grid; gap:8px; margin-top:9px; }
    .decision-item { padding:9px 10px; border:1px solid var(--line); border-radius:6px; background:#fff; }
    .decision-item h4 { margin:0 0 5px; color:#173c60; font-size:12px; }
    .decision-item p { margin:4px 0 0; line-height:1.6; }
    .decision-status { margin:7px 0 0; color:#6b7785; font-size:11px; }
    .tag-row { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 0; }
    .tech-tag { padding:3px 8px; border:1px solid transparent; border-radius:5px; font-size:11px; font-weight:700; line-height:1.45; }
    .tech-tag:hover { filter:brightness(.95); transform:translateY(-1px); }
    .tone-blue { background:#e9f2fc; border-color:#cbdff4; color:#194c7c; }
    .tone-indigo { background:#eef0fb; border-color:#d7def4; color:#374e91; }
    .tone-teal { background:#e7f5f2; border-color:#c7e5de; color:#176355; }
    .tone-purple { background:#f1ecfa; border-color:#ded1f3; color:#654390; }
    .tone-orange { background:#fff2e6; border-color:#f2dac3; color:#895018; }
    .tone-cyan { background:#e8f5f7; border-color:#cde5e9; color:#256277; }
    .tone-green { background:#ecf5e9; border-color:#d1e5cd; color:#3d6635; }
    .tone-amber { background:#faf3e2; border-color:#ecdcb3; color:#725612; }
    .tone-slate { background:#eef1f4; border-color:#dbe2e8; color:#44596b; }
    .pattern-list { display:flex; flex-direction:column; gap:9px; margin:24px 0; }
    .pattern-groups { display:flex; flex-direction:column; gap:25px; margin:24px 0; }
    .pattern-group { padding:17px 18px 18px; border-left:3px solid #9bb5c9; border-radius:0 8px 8px 0; background:#f4f7fa; }
    .pattern-group-heading { display:flex; align-items:baseline; gap:12px; margin-bottom:5px; color:var(--ink); }
    .pattern-group-heading span { color:#557b99; font-size:13px; font-weight:700; }
    .pattern-group-heading h2 { margin:0; font-size:19px; }
    .pattern-group-question { margin:0 0 13px; color:#526d82; font-size:13px; }
    .pattern-group .pattern-list { margin:0; }
    .pattern-row { display:grid; grid-template-columns:44px minmax(210px,1fr) minmax(220px,auto) 20px; align-items:center; gap:17px; width:100%; min-height:78px; padding:13px 18px; border:1px solid var(--line); border-radius:9px; background:#fff; text-align:left; }
    .pattern-row:hover,.pattern-row:focus-visible { border-color:#79a9cb; background:#fbfdff; box-shadow:0 2px 9px #0b315112; }
    .pattern-row-number { color:#507c9d; font-size:15px; font-weight:700; }
    .pattern-row-main strong { display:block; color:var(--ink); font-size:16px; }
    .pattern-row-main small { display:block; margin-top:3px; color:var(--muted); font-size:12px; line-height:1.5; }
    .pattern-row-tags { display:flex; flex-wrap:wrap; justify-content:flex-end; gap:5px; }
    .pattern-row-arrow { color:#5a83a4; font-size:20px; text-align:right; }
    .pattern-overlay { position:fixed; z-index:80; inset:0; display:flex; justify-content:flex-end; background:rgba(13,29,48,.48); }
    .pattern-drawer { display:flex; flex-direction:column; width:min(980px,68vw); height:100vh; background:#fff; box-shadow:-14px 0 40px #071b3150; animation:pattern-slide .22s ease-out; }
    @keyframes pattern-slide { from { transform:translateX(36px); opacity:.8; } to { transform:translateX(0); opacity:1; } }
    .pattern-drawer-head { flex:none; display:flex; align-items:flex-start; justify-content:space-between; gap:18px; padding:18px 28px 15px; border-bottom:1px solid var(--line); background:#fff; }
    .pattern-drawer-head p { margin:0 0 3px; color:#527592; font-size:12px; font-weight:700; }
    .pattern-drawer-head .pattern-category-note { margin-top:5px; font-weight:400; }
    .pattern-drawer-head h2 { margin:0; color:var(--ink); font-size:23px; line-height:1.3; }
    .pattern-head-actions { display:flex; align-items:center; gap:7px; }
    .pattern-switch { padding:5px 8px; border:1px solid #d4e1eb; border-radius:5px; background:#f5f9fc; color:#245b80; font-size:11px; white-space:nowrap; }
    .pattern-switch:disabled { color:#9aaab7; cursor:default; }
    .pattern-drawer-scroll { flex:1; overflow-y:auto; overscroll-behavior:contain; padding:22px 32px 48px; }
    .pattern-drawer-intro { margin:0 0 26px; color:#4a657d; font-size:14px; }
    .pattern-section { padding:20px 0; border-top:1px solid #e3eaf0; }
    .pattern-section:first-of-type { border-top:0; }
    .pattern-section h3 { margin:0 0 13px; font-size:18px; color:var(--ink); }
    .pattern-section p { margin:7px 0; font-size:13px; line-height:1.75; color:#3e566b; }
    .pattern-section h4 { margin:11px 0 5px; font-size:13px; color:var(--ink); }
    .pattern-section ul { margin:6px 0; padding-left:20px; color:#3e566b; font-size:13px; line-height:1.75; }
    .pattern-section-number { display:inline-grid; place-items:center; width:25px; height:25px; margin-right:9px; border-radius:6px; background:#e8f0f7; color:#205b85; font-size:12px; }
    .pattern-io { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .pattern-io > div { padding:11px 13px; border-radius:7px; background:#f5f8fb; }
    .pattern-flow { position:relative; display:flex; flex-direction:column; gap:0; margin:12px 0 4px 10px; padding-left:26px; border-left:2px solid #bcd2e1; }
    .pattern-phase { margin:10px 0 8px -15px; padding:3px 8px; align-self:flex-start; background:#e9f1f6; border-radius:4px; color:#356384; font-size:11px; font-weight:700; }
    .pattern-step { position:relative; margin:0 0 12px; padding:12px 16px; background:#f8fbfd; border:1px solid #dce7ef; border-radius:8px; }
    .pattern-step::before { content:""; position:absolute; top:20px; left:-33px; width:10px; height:10px; border:2px solid #6496b9; border-radius:50%; background:#fff; }
    .pattern-step:not(:last-child)::after { content:"↓"; position:absolute; left:-35px; bottom:-15px; color:#5686a7; font-size:16px; }
    .pattern-step-head { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .pattern-step-head strong { color:var(--ink); font-size:14px; }
    .pattern-step-head small { color:#5d7e98; font-weight:700; }
    .pattern-step p { margin:5px 0; }
    .pattern-step .tag-row { margin-top:7px; }
    .pattern-flow-result { margin:1px 0 12px; padding:9px 13px; border-radius:7px; background:#eaf2f7; color:#214e6d; font-size:13px; font-weight:700; }
    .pattern-human { padding:2px 8px; border:1px solid #c9d2d8; border-radius:5px; background:#f1f3f4; color:#4e5b64; font-size:11px; font-weight:700; }
    .pattern-decision { padding:12px 15px; border-bottom:1px solid #e6edf2; }
    .pattern-decision:last-child { border-bottom:0; }
    .pattern-decision summary { cursor:pointer; color:#235a80; font-size:13px; font-weight:700; }
    .pattern-decision p { margin:8px 0 0; }
    .pattern-architecture-tabs { display:flex; flex-wrap:wrap; gap:7px; margin:12px 0; }
    .pattern-architecture-tab { padding:7px 11px; border:1px solid #cbdce9; border-radius:6px; background:#f5f8fa; color:#34556e; font-size:12px; cursor:pointer; }
    .pattern-architecture-tab[aria-selected="true"] { border-color:#447ca5; background:#e8f2f9; color:#174f78; font-weight:700; }
    .pattern-architecture-panel { padding:15px 18px; border:1px solid #d9e5ed; border-left:3px solid #6f9dbc; border-radius:7px; background:#f8fbfd; }
    .pattern-architecture-panel h4 { margin-top:0; font-size:15px; }
    .pattern-architecture-panel .tag-row { margin:8px 0; }
    .pattern-architecture-hint { color:#60788b; font-size:12px; }
    .pattern-related { margin-top:22px; padding:12px 0; border-top:1px solid var(--line); color:#496279; font-size:12px; }
    .pattern-related summary { cursor:pointer; font-weight:700; }
    .pattern-links,.study-links { display:flex; flex-wrap:wrap; gap:7px; margin:9px 0; }
    .pattern-link,.study-link { padding:6px 10px; border:1px solid #cbdceb; border-radius:6px; background:#f4f8fc; color:#1e557c; cursor:pointer; font-size:12px; text-align:left; }
    .pattern-link:hover,.study-link:hover { background:#e8f2f9; }
    .compare-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:10px 0 20px; }
    .compare-cell { border:1px solid var(--line); border-radius:8px; padding:15px; background:#fff; }
